services:
  - type: web
    name: mindcanvas-api
    runtime: node
    plan: free
    rootDir: .
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build --workspace apps/server
    startCommand: npm run start --workspace apps/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
      - key: WEB_ORIGIN
        value: https://mindcanvas-wp23.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: EXPERIENTIAL_LABS_BASE_URL
        sync: false
      - key: EXPERIENTIAL_LABS_API_KEY
        sync: false
      - key: EXPERIENTIAL_LABS_MODEL
        sync: false
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_MODELS
        sync: false
      - key: GEMINI_TIMEOUT_MS
        value: "25000"
      - key: GEMINI_RETRIES_PER_MODEL
        value: "1"
      - key: GEMINI_TOTAL_TIMEOUT_MS
        value: "120000"
      - key: GEMINI_RETRY_BASE_MS
        value: "1000"
      - key: AI_MAX_CONCURRENT
        value: "2"
      - key: AI_MAX_QUEUE
        value: "20"
      - key: AI_MAX_QUEUE_PER_USER
        value: "2"
      - key: AI_QUEUE_TIMEOUT_MS
        value: "30000"
      - key: MAX_DOCUMENT_BYTES
        value: "10485760"
