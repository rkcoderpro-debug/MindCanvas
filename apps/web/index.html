<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f4ff" />
    <meta name="description" content="Không gian học tập trực quan với canvas, mind map và flashcard." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MindCanvas" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/mindcanvas-192.png" />
    <script>
      try {
        const savedTheme = localStorage.getItem("mindcanvas:theme");
        if (["light", "ocean", "mint", "sunset", "berry", "dark", "cobalt", "cyber", "forest", "slate"].includes(savedTheme)) document.documentElement.dataset.theme = savedTheme;
      } catch {}
    </script>
    <title>MindCanvas — Study workspace</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
